services:
  db:
    image: postgres:16-alpine
    container_name: hteoye-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-h_teoye}
    ports:
      - "5433:5432"
    volumes:
      - hteoye-postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: h-teoye-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-h_teoye}?schema=public
    depends_on:
      - db

volumes:
  hteoye-postgres-data:
