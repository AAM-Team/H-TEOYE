# Base de datos local para desarrollo: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: hteoye-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hteoye
      POSTGRES_PASSWORD: hteoye
      POSTGRES_DB: hteoye
    ports:
      - "5432:5432"
    volumes:
      - hteoye-datos:/var/lib/postgresql/data
volumes:
  hteoye-datos:
